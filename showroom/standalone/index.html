<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Showroom – gebrauchte Fahrräder</title>
    <meta
      name="description"
      content="Gebrauchte Fahrräder aus eigener Werkstatt: durchgesehen, gereinigt und mit allen bekannten Mängeln offen beschrieben."
    />

    <!--
      Platzhalter. Sobald eine eigene Domain feststeht, hier den echten Namen,
      eine echte Beschreibung und ein og:image eintragen – diese Angaben sind
      das, was WhatsApp und Facebook in der Linkvorschau zeigen.
    -->
    <meta property="og:title" content="Showroom – gebrauchte Fahrräder" />
    <meta
      property="og:description"
      content="Gebrauchte Fahrräder aus eigener Werkstatt: durchgesehen, gereinigt und mit allen bekannten Mängeln offen beschrieben."
    />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#0a0908" />

    <style>
      /* Vor dem ersten Rendern liegt sonst kurz eine weiße Fläche über der
         Seite – bei einem so dunklen Entwurf fällt das unangenehm auf. */
      html,
      body {
        margin: 0;
        background-color: #0a0908;
        color: #ece6df;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
